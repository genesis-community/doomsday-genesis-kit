---
meta:
  server_crt: (( vault meta.vault "/ssl/server:certificate" ))
  server_key: (( vault meta.vault "/ssl/server:key" ))

# Only the certificate is exported.  Exodus data is readable by anything
# that reads the exodus mount, so the private key stays in this
# environment's secrets.
exodus:
  server_crt: (( grab meta.server_crt ))

instance_groups:
  - name: doomsday
    jobs:
      - name: doomsday
        properties:
          server:
            port: 443
            tls:
              cert: (( grab meta.server_crt ))
              key:  (( grab meta.server_key ))  

