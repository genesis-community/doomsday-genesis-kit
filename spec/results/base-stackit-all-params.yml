exodus:
  admin_password: <!{meta.vault}/users/admin:password!>
  admin_username: admin
  bosh: base-stackit-all-params
  features: lb,tls,userpass
  iaas: aws
  is_director: false
  scale: null
  server_crt: <!{meta.vault}/ssl/server:certificate!>
  server_key: <!{meta.vault}/ssl/server:key!>
  services: null
  url: https://10.99.0.16
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - name: doomsday
    properties:
      debug: false
      server:
        auth:
          properties:
            password: <!{meta.vault}/users/admin:password!>
            refresh: true
            timeout: 30
            username: admin
          type: userpass
        port: 443
        tls:
          cert: <!{meta.vault}/ssl/server:certificate!>
          key: <!{meta.vault}/ssl/server:key!>
    release: doomsday
  name: doomsday
  networks:
  - name: test-network
    static_ips:
    - 10.99.0.16
  stemcell: default
  vm_extensions:
  - doomsday-lb
  vm_type: test-vm-type
name: base-stackit-all-params-doomsday
releases:
- name: doomsday
  sha1: aaa73a9ee876524c3a8a2a7374eaef0a9d874e05
  url: https://github.com/cloudfoundry-community/doomsday-boshrelease/releases/download/v0.9.8/doomsday-0.9.8.tgz
  version: 0.9.8
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest
update:
  canaries: 1
  canary_watch_time: 5000-600000
  max_errors: 1
  max_in_flight: 1
  serial: false
  update_watch_time: 5000-600000
