---
meta:
  exodus_{{OCFP_ENV_NAME}}: (( concat genesis.exodus_mount "/{{OCFP_ENV_NAME}}/bosh" ))

instance_groups:
  - name: doomsday
    jobs:
      - name: doomsday
        properties:
          backends:
            - (( append ))
            - type: credhub
              name: {{OCFP_ENV_NAME}}-credhub
              properties:
                address:  (( vault meta.exodus_{{OCFP_ENV_NAME}} ":credhub_url" )) 
                ca_certs: (( vault meta.exodus_{{OCFP_ENV_NAME}} ":credhub_ca_cert" )) 
                insecure_skip_verify: true
                auth:
                  grant_type: client_credentials
                  client_id:     (( vault meta.exodus_{{OCFP_ENV_NAME}} ":doomsday_client_id" ))
                  client_secret: (( vault meta.exodus_{{OCFP_ENV_NAME}} ":doomsday_client_secret" ))
                  #grant_type: password
                  #username: (( vault meta.exodus_{{OCFP_ENV_NAME}} ":credhub_username" ))
                  #password: (( vault meta.exodus_{{OCFP_ENV_NAME}} ":credhub_password" ))

