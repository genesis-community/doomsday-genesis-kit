---
instance_groups:
  - name: doomsday
    jobs:
      - name: doomsday
        properties:
          backends:
            - (( append ))
            - type: vault
              name: "{{OCFP_ENV_NAME}}-vault"
              refresh_interval: 60
              properties:
                base_path: "{{OCFP_VAULT_PREFIX}}{{OCFP_ENV_PATH}}"
                address:   (( vault "{{OCFP_VAULT_PREFIX}}exodus/{{OCFP_ENV_NAME}}/vault:url" ))
                ca_certs:  (( vault "{{OCFP_VAULT_PREFIX}}exodus/{{OCFP_ENV_NAME}}/vault:ca" ))
                namespace: "" # (( vault "{{OCFP_VAULT_PREFIX}}{{OCFP_ENV_PATH}}/vault:namespace" ))
                insecure_skip_verify: true
                trace: true
                auth:
                  role_id:   (( vault "{{OCFP_VAULT_PREFIX}}{{OCFP_ENV_PATH}}/doomsday/vault:approle_id" ))
                  secret_id: (( vault "{{OCFP_VAULT_PREFIX}}{{OCFP_ENV_PATH}}/doomsday/vault:approle_secret" ))

