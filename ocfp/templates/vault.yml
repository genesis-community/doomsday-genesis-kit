---
instance_groups:
  - name: doomsday
    jobs:
      - name: doomsday
        properties:
          backends:
            - (( append ))
            - type: vault
              name: "{{OCFP_ENV_NAME}}-vault"
              refresh_interval: 60
              properties:
                base_path: "/{{OCFP_ENV_PATH}}"
                address:   (( vault "{{OCFP_ENV_PATH}}/doomsday/vault:url" ))
                ca_certs:  (( vault "{{OCFP_ENV_PATH}}/doomsday/vault:ca" ))
                namespace: (( vault "{{OCFP_ENV_PATH}}/doomsday/vault:namespace" ))
                insecure_skip_verify: true
                trace: true
                auth:
                  role_id:   (( vault "{{OCFP_ENV_PATH}}/doomsday/vault:role_id" ))
                  secret_id: (( vault "{{OCFP_ENV_PATH}}/doomsday/vault:secret_id" ))

