---
meta:
  vault_{{OCFP_ENV_NAME}}: (( concat genesis.secrets_mount "/{{OCFP_ENV_PATH}}/doomsday/vault" ))

instance_groups:
  - name: doomsday
    jobs:
      - name: doomsday
        properties:
          backends:
            - (( append ))
            - type: vault
              name: {{OCFP_ENV_NAME}}-vault
              refresh_interval: 60
              properties:
                base_path: (( concat genesis.secrets_mount "/{{OCFP_ENV_PATH}}" ))
                address:   (( vault meta.vault_{{OCFP_ENV_NAME}} ":url" ))
                ca_certs:  (( vault meta.vault_{{OCFP_ENV_NAME}} ":ca" ))
                namespace: (( vault meta.vault_{{OCFP_ENV_NAME}} ":namespace" ))
                insecure_skip_verify: true
                trace: true
                auth:
                  role_id:   (( vault meta.vault_{{OCFP_ENV_NAME}} ":role_id" ))
                  secret_id: (( vault meta.vault_{{OCFP_ENV_NAME}} ":secret_id" ))

